<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Mediterranean Sea & Night Sky Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03045e" />
      <stop offset="50%" stop-color="#0077b6" />
      <stop offset="100%" stop-color="#0096c7" />
    </linearGradient>

    <!-- Golden Italian Sunset Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#ff9e00" />
    </linearGradient>

    <!-- Crisp White Ship Hull Gradient -->
    <linearGradient id="shipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e9ecef" />
    </linearGradient>

    <!-- Turquoise Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="50%" stop-color="#48cae4" />
      <stop offset="100%" stop-color="#90e0ef" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Background Icon Container -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />

  <!-- Golden Mediterranean Sunset Circle -->
  <circle cx="256" cy="220" r="115" fill="url(#sunGrad)" filter="url(#shadow)" />

  <!-- Cruise Ship Body & Deck Architecture (Norwegian Viva Silhouette) -->
  <g filter="url(#shadow)">
    <!-- Ship Hull Slicing Left to Right -->
    <path d="M 80 320 L 410 320 L 450 280 L 70 280 Z" fill="url(#shipGrad)" />
    <!-- Vibrant Orange Accent Stripe on Hull -->
    <path d="M 75 295 L 435 295" stroke="#ff9e00" stroke-width="8" stroke-linecap="round" />
    <!-- Mid Deck Tier 1 -->
    <path d="M 110 280 L 390 280 L 375 245 L 125 245 Z" fill="#ffffff" />
    <!-- Upper Deck Tier 2 -->
    <path d="M 140 245 L 350 245 L 335 215 L 155 215 Z" fill="#f8f9fa" />
    <!-- Top Deck Bridge & Observation Lounge -->
    <path d="M 180 215 L 310 215 L 295 190 L 195 190 Z" fill="#e9ecef" />
    <!-- Cruise Funnel / Smokestack with Viva Blue & Gold Emblem -->
    <path d="M 225 190 L 265 190 L 260 155 L 230 155 Z" fill="#0077b6" />
    <path d="M 230 165 L 262 165" stroke="#ff9e00" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Dynamic Foreground Turquoise Ocean Waves -->
  <path d="M 0 340 Q 80 310, 180 340 T 360 340 T 512 330 L 512 512 L 0 512 Z" fill="url(#waveGrad)" opacity="0.95" />
  <path d="M 0 380 Q 120 350, 260 385 T 512 370 L 512 512 L 0 512 Z" fill="#0077b6" opacity="0.8" />
  <path d="M 0 430 Q 160 400, 320 440 T 512 420 L 512 512 L 0 512 Z" fill="#03045e" opacity="0.9" />

  <!-- Sparkles in Sky -->
  <circle cx="120" cy="110" r="4" fill="#ffffff" opacity="0.7" />
  <circle cx="390" cy="90" r="5" fill="#ffffff" opacity="0.8" />
  <circle cx="430" cy="160" r="3" fill="#ffffff" opacity="0.6" />
</svg>
